name: Compiler probes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe/**', '.github/workflows/blank.yml']
permissions:
  contents: read
concurrency:
  group: compiler-probes
  cancel-in-progress: false
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 probe/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-probe-evidence
          path: |
            results
            probe-results
          retention-days: 30
